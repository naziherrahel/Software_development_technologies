services:
  app_blue:
    build: ./app_blue
    container_name: deployment_lab_app_blue
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - deployment_lab

  app_green:
    build: ./app_green
    container_name: deployment_lab_app_green
    environment:
      # Change this during the lab to simulate an unstable new release.
      # Example: FAIL_RATE=0.3 means about 30% of GREEN requests fail.
      FAIL_RATE: "0.0"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - deployment_lab

  nginx:
    image: nginx:1.27-alpine
    container_name: deployment_lab_nginx
    depends_on:
      app_blue:
        condition: service_healthy
      app_green:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx:/etc/nginx/lab:ro
    command: >
      /bin/sh -c "cp /etc/nginx/lab/nginx.blue.conf /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    networks:
      - deployment_lab

  locust:
    image: locustio/locust:2.32.6
    container_name: deployment_lab_locust
    depends_on:
      - nginx
    ports:
      - "${LOCUST_PORT:-8089}:8089"
    volumes:
      - ./locust:/mnt/locust:ro
    command: -f /mnt/locust/locustfile.py --host http://nginx
    networks:
      - deployment_lab

networks:
  deployment_lab:
    name: deployment_lab_network
