# GREEN mode: 100% of user traffic goes to the new GREEN version.
# This simulates releasing the new version to all users.

log_format lab '$remote_addr - $time_local "$request" '
               'status=$status upstream=$upstream_addr '
               'upstream_status=$upstream_status '
               'upstream_time=$upstream_response_time request_time=$request_time';

upstream app_backend {
    server app_green:8000;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log lab;
    error_log /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_next_upstream off;
    }
}
